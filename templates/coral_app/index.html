{% extends "base.html" %}{% load static %}
{% block title %}首页{% endblock %}
{% block style %}
    <style>
        /* 背景图样式 */
        body {
            position: relative;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("{% static 'images/bg7.jpg' %}");
            background-size: cover;
            background-position: center;
            opacity: 0.5;
            z-index: -1;
        }

        /* 左侧导航菜单样式 */
        .nav-sidebar {
            width: 280px;
            position: fixed;
            left: 20px;
            top: 10%;
            height: auto;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 20px 0;
            z-index: 1;
        }

        .nav-sidebar .nav-item {
            margin: 10px 15px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 10px;
            color: #333;
            font-size: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .nav-sidebar .nav-item:before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: #4CAF50;
            transform: scaleY(0);
            transition: transform 0.3s;
        }

        .nav-sidebar .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .nav-sidebar .nav-item:hover:before {
            transform: scaleY(1);
        }

        .nav-sidebar .nav-item.active {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.8) 0%, rgba(33, 150, 243, 0.8) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .nav-sidebar .nav-item.active:before {
            transform: scaleY(1);
        }

        /* 添加图标样式 */
        .nav-sidebar .nav-item::after {
            content: '→';
            position: absolute;
            right: 15px;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .nav-sidebar .nav-item:hover::after {
            opacity: 1;
            transform: translateX(5px);
        }

        /* 右侧内容区域样式调整 */
        .main-content {
            margin-left: 320px;
            padding: 20px;
            height: 100vh;
            background-color: transparent;
            z-index: 1;
        }

        #content-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
{% endblock %}
{% block content %}
    <!-- 左侧导航菜单 -->
    <div class="nav-sidebar">
        <div class="nav-item active" onclick="loadContent('{% url 'coral_app:information' %}', this)">
            珊瑚知识科普
        </div>
        <div class="nav-item" onclick="loadContent('{% url 'coral_app:sst_chart1' %}', this)">
            SST数据动态变化趋势
        </div>
        <div class="nav-item" onclick="loadContent('{% url 'coral_app:sst_chart_view' %}', this)">
            年度海温可视化
        </div>
        <div class="nav-item" onclick="loadContent('{% url 'coral_app:dhw_sst_chart' %}', this)">
            DHW与SST时间序列分析
        </div>
        <div class="nav-item" onclick="loadContent('{% static 'coral/sst_map.html' %}', this)">
            南海热力图
        </div>
        <!-- 新增分析页面导航项 -->
        <div class="nav-item" onclick="loadContent('{% url 'coral_app:analysis_dashboard' %}', this)">
            珊瑚健康评估系统
        </div>
{#        <div class="nav-item" onclick="loadContent('{% url 'coral_app:export_report' %}?format=pdf', this)">#}
{#            分析报告预览#}
{#        </div>#}
        <!-- 添加YOLO检测导航项 -->
        <div class="nav-item" onclick="loadContent('{% url 'coral_app:yolo_detection' %}', this)">
            珊瑚健康状态检测
        </div>
    </div>

    <!-- 右侧内容区域 -->
    <div class="main-content">
        <iframe id="content-frame" name="content-frame"></iframe>
    </div>

    <script>
        // 页面加载时默认显示第一个选项
        window.onload = function() {
            document.querySelector('.nav-item').click();
        }

        function loadContent(url, element) {
            // 更新iframe内容
            document.getElementById('content-frame').src = url;

            // 更新选中状态
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');
        }
    </script>
{% endblock %}
